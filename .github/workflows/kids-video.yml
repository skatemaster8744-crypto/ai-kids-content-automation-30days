name: Generate and upload kids cartoon

on:
  workflow_dispatch:
    inputs:
      video_mode:
        description: "Video format"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - short
          - long
  schedule:
    # 16:00 India Standard Time (10:30 UTC), daily
    - cron: "30 10 * * *"

permissions:
  contents: read

concurrency:
  group: kids-video-pipeline
  cancel-in-progress: false

jobs:
  create-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - name: Install dependencies
        run: pip install -r automation/requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          BACKGROUND_MUSIC_BASE64: ${{ secrets.BACKGROUND_MUSIC_BASE64 }}
          VIDEO_MODE: ${{ inputs.video_mode || 'auto' }}
          YOUTUBE_PRIVACY_STATUS: private
          AUTO_SCHEDULE: "true"
          PUBLISH_DELAY_HOURS: "24"
          MADE_FOR_KIDS: "true"
          OUTPUT_DIR: output
        run: python automation/main.py
      - name: Upload run artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kids-video-run-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 7
